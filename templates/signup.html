{% extends "base.html" %}

{% block title %}Sign Up - IoT Production System{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card">
        <div class="card-header" style="text-align: center;">
            <div class="icon">📝</div>
            <h2>Sign Up for IoT Production System</h2>
        </div>
        <form method="POST">
            <div class="form-group">
                <label for="name">👤 Full Name</label>
                <input type="text" id="name" name="name" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="mobile">📱 Mobile Number</label>
                <input type="tel" id="mobile" name="mobile" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="email">📧 Email Address</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="address">🏠 Address</label>
                <textarea id="address" name="address" class="form-control" rows="3" required></textarea>
            </div>
            <div class="form-group">
                <label for="role">👔 Role</label>
                <select id="role" name="role" class="form-control" required>
                    <option value="">Select Role</option>
                    <option value="ev_engineer">Engineer (Full Analysis Access)</option>
                    <option value="user">User (Prediction Access)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="password">🔑 Password</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">🔑 Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success" style="width: 100%;">Sign Up</button>
        </form>
        <p style="text-align: center; margin-top: 20px;">
            Already have an account? <a href="{{ url_for('login') }}" style="color: #4169E1; font-weight: bold;">Login</a>
        </p>
    </div>
</div>
{% endblock %}
